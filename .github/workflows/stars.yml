name: Update stars

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit the list
  pages: write # deploy the site
  id-token: write # authenticate the Pages deployment

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  stars:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Options live in .github/starsmith.yml. The AI turns on once the repository has an
      # AI_PROVIDER variable (openai, anthropic, google, mistral, openrouter) and an AI_API_KEY
      # secret; until then the list is built without it.
      - uses: maxgfr/starsmith@v1
        with:
          ai-provider: ${{ vars.AI_PROVIDER }}
          ai-api-key: ${{ secrets.AI_API_KEY }}
      # The searchable site starsmith wrote in docs/, served at https://maxgfr.github.io/awesome-stars/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
